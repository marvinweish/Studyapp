# Alternative App Runner configurations for different Python versions

# Option 1: Python 3.8 (Current - most compatible)
version: 1.0
runtime: python3
build:
  commands:
    build:
      - echo "Installing dependencies for Python 3.8..."
      - python --version
      - pip --version
      - pip install --upgrade pip
      - pip install -r requirements.txt
      - echo "Dependencies installed successfully"
run:
  runtime-version: 3.8
  command: python study_app.py
  network:
    port: 8080
  env:
    - name: PORT
      value: "8080"
    - name: FLET_WEB_RENDERER
      value: "html"
    - name: PYTHONUNBUFFERED
      value: "1"

